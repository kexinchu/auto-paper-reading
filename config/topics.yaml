    description: "关注内存与互连子系统：CXL、RDMA、内存池化/分解、分层内存、HBM/带宽墙、GPU 显存管理、近存计算。只收系统/架构/运行时，排除纯编译器优化、纯网络协议、以及与内存无关的通用 LLM Serving。"
