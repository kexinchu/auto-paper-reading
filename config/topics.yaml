topics:
  - id: "ann-retrieval-systems"
    name: "ANNS 与检索系统（偏系统/落地）"
    description: "关注近似最近邻/向量检索的系统与工程：图索引与磁盘索引、GPU/CPU 协同、分布式检索、动态更新、成本-延迟-召回权衡、Serving 与多租户。检索增强里只收索引/检索 Serving 层，排除纯新距离函数、纯理论分析、以及聊天机器人/垂直领域 RAG 应用。"
